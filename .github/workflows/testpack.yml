name: testpack

# Builds the DXVM TestPack APK. Android SDK/NDK are not available in the agent
# environment, so this workflow is where the app's Kotlin/C++ tests and the APK
# assembly actually run. A local pass only proves the source compiles logically;
# this file is the evidence gate.
on:
  push:
    paths:
      - 'apps/dxvm-testpack/**'
      - '.github/workflows/testpack.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK + NDK
        run: |
          ANDROID_SDK_ROOT="$HOME/android-sdk"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" \
            "ndk;29.0.14206865" "cmake;3.22.1" >/dev/null

      - name: Host-side component tests
        run: python3 -m pytest apps/dxvm-testpack/tests/component -q

      - name: Vulkan suite ports (lavapipe)
        run: bash apps/dxvm-testpack/tests/vktests/run-host.sh || true

      - name: Unit tests
        working-directory: apps/dxvm-testpack
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Assemble
        working-directory: apps/dxvm-testpack
        run: ./gradlew --no-daemon -Dorg.gradle.jvmargs=-Xmx3g :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dxvm-testpack-debug
          path: apps/dxvm-testpack/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error